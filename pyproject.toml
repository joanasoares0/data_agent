[project]
name = "data-agent"
version = "0.1.0"
description = "Multi-agent data assistant (LangGraph): a router sends plain-English requests to a SQL analyst (Postgres) or an ETL analyst (APIs and files)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]
