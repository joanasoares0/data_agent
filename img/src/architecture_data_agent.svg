6" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="320" x2="436" y2="330" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="320" x2="436" y2="354" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="340" x2="436" y2="306" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="340" x2="436" y2="330" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="340" x2="436" y2="354" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="360" x2="436" y2="306" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="360" x2="436" y2="330" stroke="#6c7086" stroke-width="0.8"/><line x1="410" y1="360" x2="436" y2="354" stroke="#6c7086" stroke-width="0.8"/><circle cx="384" cy="306" r="4.5" fill="#ffffff"/><circle cx="384" cy="330" r="4.5" fill="#ffffff"/><circle cx="384" cy="354" r="4.5" fill="#ffffff"/><circle cx="410" cy="300" r="4.5" fill="#ffffff"/><circle cx="410" cy="320" r="4.5" fill="#ffffff"/><circle cx="410" cy="340" r="4.5" fill="#ffffff"/><circle cx="410" cy="360" r="4.5" fill="#ffffff"/><circle cx="436" cy="306" r="4.5" fill="#ffffff"/><circle cx="436" cy="330" r="4.5" fill="#ffffff"/><circle cx="436" cy="354" r="4.5" fill="#ffffff"/><text x="410" y="402" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Router LLM</text><text x="410" y="423" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">(structured output)</text><text x="410" y="266" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">advanced</text><path d="M480,330 H600" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><g filter="url(#rough)"><circle cx="650" cy="330" r="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/></g><text x="650" y="398" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Route?</text><text x="650" y="440" font-size="15" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">RouteSchema:</text><text x="650" y="459" font-size="15" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">answer = sql | etl</text><path d="M690,310 H760 V190 H860" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="735" y="180" font-size="20" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">sql</text><g filter="url(#rough)"><rect x="860" y="105" width="520" height="170" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1120.0" y="135" font-size="21" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">SQL Analyst Agent  (sub-graph)</text><text x="878" y="167" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">curate question -> add DB context -> write SQL</text><text x="878" y="192" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">-> judge: safe? -> run on Postgres</text><text x="878" y="217" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">-> explain the rows in plain English</text><path d="M690,350 H760 V480 H860" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="735" y="505" font-size="20" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">etl</text><g filter="url(#rough)"><rect x="860" y="395" width="520" height="170" rx="14" fill="#fff9db" stroke="#f08c00" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1120.0" y="425" font-size="21" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">ETL Analyst Agent  (sub-graph)</text><text x="878" y="457" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">LLM picks a tool in a loop:</text><text x="878" y="482" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">extract API data  or  transform a file</text><text x="878" y="507" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">until the job is done</text><path d="M1380,230 H1480 V300 H1530" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1380,480 H1480 V360 H1530" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><g filter="url(#rough)"><circle cx="1575" cy="330" r="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/></g><text x="1575" y="398" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Final answer</text><text x="1575" y="421" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">(AIMessage)</text><g filter="url(#rough)"><circle cx="1745" cy="330" r="38" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/></g><text x="1745" y="337" font-size="22" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">End</text><path d="M1615,330 H1703" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><g filter="url(#rough)"><path d="M1542,110 v80 a38,12 0 0 0 76,0 v-80" fill="#1971c2" stroke="#0b4f8a" stroke-width="2"/><ellipse cx="1580" cy="110" rx="38" ry="12" fill="#74c0fc" stroke="#0b4f8a" stroke-width="2"/></g><text x="1580" y="232" font-size="21" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Postgres</text><text x="1580" y="257" font-size="21" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Database</text><path d="M1530,140 H1386" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="1460" y="128" font-size="16" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">SQL</text><g filter="url(#rough)"><path d="M1060,700 a26,26 0 0 1 6,-50 a34,34 0 0 1 62,-12 a28,28 0 0 1 50,26 a22,22 0 0 1 -6,36 z" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/></g><text x="1122" y="682" font-size="20" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">API</text><text x="1120" y="734" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">API + files</text><path d="M1120,640 V570" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arr)"/><circle cx="300" cy="610" r="14" fill="#f06595"/><circle cx="360" cy="610" r="14" fill="#e64980"/><circle cx="330" cy="628" r="15" fill="#c2255c"/><path d="M272,662 q0,-30 28,-30 q28,0 28,30 z" fill="#f06595"/><path d="M332,662 q0,-30 28,-30 q28,0 28,30 z" fill="#e64980"/><path d="M298,684 q0,-36 32,-36 q32,0 32,36 z" fill="#c2255c"/><text x="330" y="720" font-size="24" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Users</text><path d="M270,640 H110 V460" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1745,370 V790 H330 V730" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="800" y="782" font-size="17" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">answer back to the user</text></g></svg>