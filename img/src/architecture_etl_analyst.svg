6" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="290" x2="426" y2="300" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="290" x2="426" y2="324" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="310" x2="426" y2="276" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="310" x2="426" y2="300" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="310" x2="426" y2="324" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="330" x2="426" y2="276" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="330" x2="426" y2="300" stroke="#6c7086" stroke-width="0.8"/><line x1="400" y1="330" x2="426" y2="324" stroke="#6c7086" stroke-width="0.8"/><circle cx="374" cy="276" r="4.5" fill="#ffffff"/><circle cx="374" cy="300" r="4.5" fill="#ffffff"/><circle cx="374" cy="324" r="4.5" fill="#ffffff"/><circle cx="400" cy="270" r="4.5" fill="#ffffff"/><circle cx="400" cy="290" r="4.5" fill="#ffffff"/><circle cx="400" cy="310" r="4.5" fill="#ffffff"/><circle cx="400" cy="330" r="4.5" fill="#ffffff"/><circle cx="426" cy="276" r="4.5" fill="#ffffff"/><circle cx="426" cy="300" r="4.5" fill="#ffffff"/><circle cx="426" cy="324" r="4.5" fill="#ffffff"/><text x="400" y="372" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">LLM Node</text><text x="400" y="393" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">(bind_tools)</text><text x="400" y="236" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">advanced</text><text x="400" y="430" font-size="15" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">reads the chat history and</text><text x="400" y="449" font-size="15" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">decides: call a tool or answer</text><path d="M470,300 H600" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><g filter="url(#rough)"><circle cx="650" cy="300" r="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/></g><text x="650" y="368" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Tool call?</text><path d="M690,280 H760 V160 H860" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="735" y="150" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Yes</text><g filter="url(#rough)"><circle cx="910" cy="160" r="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/></g><text x="910" y="228" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Tool Node</text><g filter="url(#rough)"><rect x="1010" y="92" width="520" height="200" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1270.0" y="122" font-size="21" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Tools</text><text x="1028" y="154" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">1. extract_load_tool</text><text x="1028" y="179" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">     API  ->  pandas  ->  csv / json / parquet</text><text x="1028" y="204" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">2. transform_load_tool</text><text x="1028" y="229" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">     LLM (advanced) writes pandas code -> exec()</text><text x="1028" y="254" font-size="16" text-anchor="start" fill="#343a40" font-weight="normal" xml:space="preserve">     -> saves the transformed file</text><path d="M952,160 H1005" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><path d="M910,120 V100 H440 V245" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="560" y="90" font-size="17" text-anchor="start" fill="#1e1e1e" font-weight="normal" xml:space="preserve">ToolMessage with the result goes back to the LLM (loop)</text><path d="M690,320 H760 V450 H960" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="735" y="470" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">No</text><g filter="url(#rough)"><circle cx="1000" cy="450" r="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/></g><text x="1000" y="518" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Final answer</text><text x="1000" y="541" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">(the LLM message)</text><g filter="url(#rough)"><circle cx="1170" cy="450" r="38" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/></g><text x="1170" y="457" font-size="22" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">End</text><path d="M1040,450 H1128" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><g filter="url(#rough)"><path d="M1270,540 a26,26 0 0 1 6,-50 a34,34 0 0 1 62,-12 a28,28 0 0 1 50,26 a22,22 0 0 1 -6,36 z" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/></g><text x="1332" y="522" font-size="20" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">API</text><text x="1330" y="574" font-size="19" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">PokeAPI (web)</text><g filter="url(#rough)"><path d="M1510,460 h44 l16,16 v64 h-60 z" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/></g><rect x="1534" y="474" width="44" height="20" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.2"/><text x="1556" y="489" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">CSV</text><text x="1540" y="566" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">data/extracted</text><text x="1540" y="588" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">data/transform</text><path d="M1330,480 V297" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arr)"/><path d="M1470,297 V450" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="1340" y="400" font-size="16" text-anchor="start" fill="#495057" font-weight="normal" xml:space="preserve">extract</text><text x="1480" y="400" font-size="16" text-anchor="start" fill="#495057" font-weight="normal" xml:space="preserve">load / read</text><circle cx="300" cy="580" r="14" fill="#f06595"/><circle cx="360" cy="580" r="14" fill="#e64980"/><circle cx="330" cy="598" r="15" fill="#c2255c"/><path d="M272,632 q0,-30 28,-30 q28,0 28,30 z" fill="#f06595"/><path d="M332,632 q0,-30 28,-30 q28,0 28,30 z" fill="#e64980"/><path d="M298,654 q0,-36 32,-36 q32,0 32,36 z" fill="#c2255c"/><text x="330" y="690" font-size="24" text-anchor="middle" fill="#1e1e1e" font-weight="normal" xml:space="preserve">Users</text><path d="M270,610 H110 V435" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1170,488 V720 H330 V700" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#arr)"/><text x="750" y="712" font-size="17" text-anchor="middle" fill="#495057" font-weight="normal" xml:space="preserve">answer back to the user</text></g></svg>